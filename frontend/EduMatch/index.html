<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>EduMatch</title>
  </head>
  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          background: #030303;
        }

        .initial-loader {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          background: #030303;
          color: white;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .initial-loader__orb {
          position: fixed;
          top: 50%;
          left: 50%;
          width: 500px;
          height: 500px;
          border-radius: 9999px;
          background: rgba(139, 92, 246, 0.2);
          filter: blur(130px);
          transform: translate(-50%, -50%);
          pointer-events: none;
        }

        .initial-loader__rings {
          position: relative;
          width: 112px;
          height: 112px;
        }

        .initial-loader__ring {
          position: absolute;
          inset: 0;
          border-radius: 9999px;
          border: 2px solid rgba(255, 255, 255, 0.05);
          border-top-color: #8b5cf6;
          animation: initial-spin 1.5s linear infinite;
        }

        .initial-loader__ring--inner {
          inset: 8px;
          border-top-color: rgba(255, 255, 255, 0.05);
          border-bottom-color: #8b5cf6;
          animation-duration: 2.5s;
          animation-direction: reverse;
        }

        .initial-loader__center {
          position: absolute;
          inset: 0;
          margin: auto;
          width: 64px;
          height: 64px;
          border-radius: 9999px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          background: #0a0a0a;
          box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
        }

        @keyframes initial-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="initial-loader">
        <div class="initial-loader__orb"></div>
        <div class="initial-loader__rings" aria-label="Loading" role="status">
          <div class="initial-loader__ring"></div>
          <div class="initial-loader__ring initial-loader__ring--inner"></div>
          <div class="initial-loader__center"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
